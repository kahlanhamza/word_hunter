<section class="review-heading"><h1>Small letters.<br><span>Big little victories.</span></h1><div class="review-caption"><span class="tiny-spark" aria-hidden="true">✦</span><p>A softer world. A playful little challenge.<br>Explore all five screens, then try the flow.</p></div></section>
<nav class="review-tabs" aria-label="Preview screens" id="review-tabs"></nav>
<section class="gallery" id="gallery" aria-label="Five mobile screen designs"></section>
<footer class="review-footer"><span><strong>UI APPROVAL PREVIEW</strong> · Sample progress and rewards. No live ads or backend.</span><span class="swatches"><i style="background:#e2d8f2"></i><i style="background:#8f70c6"></i><i style="background:#ffc95c"></i><i style="background:#ff8c1a"></i><i style="background:#2f80ed"></i><i style="background:#f83f8f"></i><span style="margin-left:7px">Made for little moments of play.</span></span></footer>
</main>
<script>
(()=>{
/* UI prototype only. Sample state is intentionally reset when switching review screens. */
const screens=['home','categories','mode','game','results'];
const labels={home:'Home',categories:'Categories',mode:'Mode select',game:'Game',results:'Results'};
const notes={home:'Meet your new word-hunting buddy.',categories:'A whole world of words to unlock.',mode:'Find your pace. Or race the clock.',game:'Just one more word...',results:'Make every little win feel big.'};
const focusContent={home:['A warm little welcome.','A custom tile mascot, a big juicy Play button, and your next adventure within reach.','Tap Play to move through the five-screen flow.'],categories:['Pick your playground.','Fifteen collectible worlds. One bright starting point. A clear path to the next discovery.','Scroll inside the phone to see all 15 categories.'],mode:['Your hunt. Your pace.','Two distinct personalities: the cozy Classic, or a speedy two-minute challenge.','Select a mode, then tap Let’s play.'],game:['The good kind of focus.','A clean letter grid, soft color trails, and a compact word list. The puzzle stays center stage.','Try dragging across a word, tap a hint, or preview the win.'],results:['A win worth a smile.','A trophy moment, your score, and a pocketful of coins. The next world is one tap away.','Sample results only. Rewards are not persisted.']};
const categories=[['Animals','🐾',18],['Food','🍕',15],['Sports','⚽',14],['Countries','🌍',15],['Colors','🎨',15],['Fruits','🍎',15],['Space','🚀',15],['Ocean Life','🌊',14],['Music','🎵',15],['Movies','🎬',14],['Nature','🌿',14],['Technology','💻',14],['Jobs','👔',14],['Clothing','👗',15],['Vegetables','🥕',14]];
const animals='CAT DOG LION TIGER ELEPHANT GIRAFFE ZEBRA MONKEY PENGUIN DOLPHIN EAGLE WOLF BEAR FOX RABBIT SNAKE TURTLE HORSE'.split(' ');
let currentView='all',mode='classic',soundEnabled=true,categoryIndex=0,unlockedPreview=false,gameFound=['CAT','DOG','TIGER'],hints=3,gameScore=30,selection=[],dragStart=null,toastTimer;
const $=s=>document.querySelector(s);
const icon=(name,cls='')=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const art=(name,cls='')=>`<svg class="${cls}" aria-hidden="true" viewBox="${name==='mascot'?'0 0 400 360':name==='trophy'?'0 0 280 240':name==='coin'?'0 0 40 40':'0 0 140 120'}"><use href="#${name}"/></svg>`;
const coin=(amount=300)=>`<div class="coin-pill" aria-label="${amount} coins">${art('coin','coin-art')}<span>${amount}</span></div>`;
const button=(text,action,kind='orange',ico='arrow')=>`<button class="game-button ${kind}" data-action="${action}"><span class="button-glint"></span>${ico==='play'?icon(ico):''}<span>${text}</span>${ico&&ico!=='play'?icon(ico):''}</button>`;
const status=()=>`<div class="statusbar"><span>9:41</span><div class="notch"></div><div class="status-icons">${icon('signal')}${icon('wifi')}${icon('battery')}</div></div>`;
const bar=(back='home',title='',balance=300)=>`<div class="app-bar"><button class="icon-btn" data-action="${back}" aria-label="Back">${icon('back')}</button><span class="bar-title">${title}</span>${coin(balance)}</div>`;
const wrap=(name,body)=>`<div class="screen ${name}-screen" data-screen="${name}">${status()}${body}<div class="safe-bottom"></div></div>`;
function home(){return wrap('home',`<div class="app-bar"><button class="icon-btn" data-action="howto" aria-label="How to play">${icon('help')}</button>${coin()}<button class="icon-btn sound-toggle" data-action="sound" aria-label="Toggle sound">${icon(soundEnabled?'sound':'muted')}</button></div><div class="home-brand"><div class="eyebrow">A little word adventure</div><h1>APP<span class="name">_NAME</span></h1><p>Find your next little victory.</p></div><div class="hero-art"><span class="hero-spark s1">✧</span>${art('mascot','mascot-svg')}<span class="hero-spark s2">✦</span><div class="hero-tag">${icon('star')}Made for your aha!</div></div><div class="home-actions">${button('Let’s play','categories','orange','play')}<div class="under-button">BIG WORDS. LITTLE HAPPY DANCES.</div></div><button class="journey-card" data-action="mode"><span class="journey-icon">🐾</span><span><span class="eyebrow">Your adventure starts here</span><strong>Animals</strong><small>World 01 · 18 hidden words</small></span>${icon('arrow')}</button><div class="home-bottom"><span>${icon('grid')}15 worlds</span><span>${icon('shield')}Offline play</span></div>`)}
function categoryScreen(){return wrap('categories',`${bar('home','YOUR WORLDS')}<div class="page-heading"><h2 class="big-title">Pick your<br>playground.</h2><span class="small-star">✦</span><p class="subtext">A little curiosity goes a long way.</p></div><div class="category-progress"><div class="progress-label"><span>YOUR ADVENTURE</span><strong>${unlockedPreview?1:0} / 15 WORLDS</strong></div><div class="progress-track"><span style="width:${unlockedPreview?7:3}%"></span></div></div><div class="category-scroller"><div class="category-grid">${categories.map((c,i)=>`<button class="category-card ${i===0||(unlockedPreview&&i===1)?'unlocked':''}" data-category="${i}" aria-label="${c[0]}, ${i===0||(unlockedPreview&&i===1)?'unlocked':'locked'}"><span class="world-number">WORLD ${String(i+1).padStart(2,'0')}</span>${icon(i===0||(unlockedPreview&&i===1)?'arrow':'lock','lock')}<span class="category-emoji">${c[1]}</span><strong>${c[0]}</strong><small>${i===0?'LET’S EXPLORE':i===1&&unlockedPreview?'READY TO EXPLORE':'LOCKED FOR NOW'}</small></button>`).join('')}</div></div><div class="scroll-fade"></div>`)}
function modeScreen(){return wrap('mode',`${bar('categories','CHOOSE YOUR VIBE')}<div class="mode-heading"><span class="pill yellow">${categories[categoryIndex][1]} WORLD ${String(categoryIndex+1).padStart(2,'0')} · ${categories[categoryIndex][0].toUpperCase()}</span><h2 class="big-title">How do<br>you hunt?</h2><p class="subtext">Same adventure. Your kind of fun.</p></div><div class="mode-cards"><button class="mode-card ${mode==='classic'?'selected':''}" data-mode="classic" aria-pressed="${mode==='classic'}"><span class="radio">${mode==='classic'?icon('check'):''}</span><div class="mode-kicker">TAKE A BREATHER</div><h3>Classic</h3><p>No rush. No clock to beat.<br>Just you and the words.</p><span class="mode-tag">∞ YOUR OWN PACE</span>${art('classic-art','mode-art')}</button><button class="mode-card time-card ${mode==='time'?'selected':''}" data-mode="time" aria-pressed="${mode==='time'}"><span class="radio">${mode==='time'?icon('check'):''}</span><div class="mode-kicker">A LITTLE ADRENALINE</div><h3>Time rush</h3><p>Two minutes.<br>Make every word count.</p><span class="mode-tag">02:00 · BEAT THE CLOCK</span>${art('time-art','mode-art')}</button></div><div class="mode-footer">${button('Let’s play','game')}<p>${icon('bulb')}3 free hints. A little nudge if you need it.</p></div>`)}
// Deterministic sample board, not a production puzzle generator.
const grid=Array.from({length:12},(_,r)=>Array.from({length:12},(_,c)=>'EARINOSTULBCDPGMFWYHVKZ'[ (r*13+c*7)%22]));
const placements={};
const samplePlacements=[['ELEPHANT',0,0,0,1],['GIRAFFE',1,1,0,1],['DOLPHIN',2,3,0,1],['PENGUIN',3,0,0,1],['RABBIT',4,6,0,1],['MONKEY',5,0,0,1],['TURTLE',6,6,0,1],['SNAKE',7,0,0,1],['HORSE',8,7,0,1],['TIGER',9,1,0,1],['ZEBRA',10,7,0,1],['EAGLE',11,0,0,1],['WOLF',4,8,1,0],['BEAR',8,6,1,0],['LION',0,11,1,0],['CAT',2,0,1,0],['DOG',7,9,0,1],['FOX',6,1,0,1]];
// Resolve the few vertical intersections by placing short sample words into free runs.
function createSample(){grid.forEach(row=>row.fill(''));const used=[];for(const [word,sr,sc,dr,dc] of samplePlacements){let positions=[];for(let r=0;r<12;r++)for(let c=0;c<12;c++)for(const [y,x]of [[dr,dc],[0,1],[1,0],[1,1],[-1,1]]){let cells=[...word].map((_,i)=>[r+y*i,c+x*i]);if(cells.every(([a,b],i)=>a>=0&&a<12&&b>=0&&b<12&&(!grid[a][b]||grid[a][b]===word[i])))positions.push({cells,priority:(r===sr&&c===sc&&y===dr&&x===dc)?0:1})}positions.sort((a,b)=>a.priority-b.priority);const cells=positions[0]?.cells;if(!cells)continue;placements[word]=cells;cells.forEach(([r,c],i)=>grid[r][c]=word[i]);}grid.forEach((row,r)=>row.forEach((v,c)=>{if(!v)grid[r][c]='EARINOSTULBCDPGMFWYHVKZ'[(r*13+c*7)%22]}))}createSample();
function lines(){const colors=['#f38cbb','#7bb2ee','#b3db79','#c4a1e1','#ffb466','#8bdacb'];return gameFound.map((w,i)=>{const p=placements[w];if(!p)return '';const a=p[0],b=p[p.length-1];return `<line x1="${a[1]*100/12+100/24}" y1="${a[0]*100/12+100/24}" x2="${b[1]*100/12+100/24}" y2="${b[0]*100/12+100/24}" stroke="${colors[i%colors.length]}" stroke-opacity=".35" stroke-width="6.7" stroke-linecap="round"/>`}).join('')}
function gameScreen(){return wrap('game',`<div class="app-bar"><button class="icon-btn" data-action="pause" aria-label="Pause puzzle">${icon('back')}</button><div class="game-title">Animals<small>WORLD 01 · ${mode==='classic'?'CLASSIC':'TIME MODE'}</small></div>${coin()}</div><div class="game-stats"><div class="score-wrap">${icon('star','score-star')}<div><small>SCORE</small><strong id="sample-score">${gameScore}</strong></div></div><div class="timer-pill">${icon('clock')}<span>${mode==='classic'?'0:42':'1:18'}</span></div></div><div class="found-meter"><div class="track"><span id="found-progress" style="width:${gameFound.length/18*100}%"></span></div><small id="found-count">${gameFound.length} / 18 found</small></div><div class="board-shell"><div class="letter-board" aria-label="Sample word search puzzle, drag in a straight line"><svg class="board-lines" viewBox="0 0 100 100" preserveAspectRatio="none">${lines()}</svg>${grid.flatMap((row,r)=>row.map((l,c)=>`<span class="letter" data-row="${r}" data-col="${c}">${l}</span>`)).join('')}</div></div><div class="selection-caption">${icon('swipe')}<span>Swipe a word. Any direction.</span></div><div class="words-heading"><span class="eyebrow">THE WORD HUNT</span><span class="bonus-chip">✦ BONUS WORDS +5</span></div><div class="word-list">${animals.map(w=>`<span class="word-chip ${gameFound.includes(w)?'found':''}" data-word="${w}">${w}</span>`).join('')}</div><div class="game-tools"><button class="hint-button" data-action="hint" ${hints?'':'disabled'}>${icon('bulb')}A little hint<span class="hint-badge">${hints}</span></button><button class="reward-button" data-action="reward">${icon('play')}Watch for +1</button></div>`)}
function resultsScreen(){return wrap('results',`${bar('home','YOU DID IT!',350)}<div class="results-heading"><h2 class="big-title">Word wizard!</h2><span class="pill">${icon('check')}ANIMALS COMPLETE</span></div><div class="trophy-scene">${art('trophy')}</div><div class="result-card"><div class="eyebrow">YOUR HAPPY LITTLE HIGH SCORE</div><div class="result-score">${mode==='classic'?195:275}<small>pts</small></div><div class="result-metrics"><div><strong>18</strong><small>words found</small></div><div><strong>3</strong><small>bonus words</small></div><div><strong>${mode==='classic'?'2:14':'1:20'}</strong><small>time taken</small></div></div></div><div class="earned-coins">${art('coin','coin-art')}+50 coins<span>Nicely earned!</span></div><div class="results-actions">${button('Next level','next-level')}<div class="results-secondary">${button('Play again','replay','white','repeat')}${button('Home','home','white','home')}</div><div class="next-world">A tasty new adventure awaits. <b>Next up: Food 🍕</b></div></div>`)}
const screenRenderers={home,categories:categoryScreen,mode:modeScreen,game:gameScreen,results:resultsScreen};
function render(view=currentView){currentView=view;$('#review').classList.toggle('focus-mode',view!=='all');$('#review-tabs').innerHTML=`<button class="${view==='all'?'active':''}" data-view="all" aria-current="${view==='all'?'page':'false'}">${icon('grid')} <span style="margin-left:5px">All screens</span></button><span class="divider"></span>${screens.map((s,i)=>`<button class="${view===s?'active':''}" data-view="${s}" aria-current="${view===s?'page':'false'}"><span class="num">0${i+1}</span>${labels[s]}</button>`).join('')}`;const selected=view==='all'?screens:[view];$('#gallery').className='gallery'+(view==='all'?'':' single');$('#gallery').innerHTML=(view==='all'?'':`<aside class="focus-copy"><div class="eyebrow">0${screens.indexOf(view)+1} / ${labels[view]}</div><h2>${focusContent[view][0]}</h2><p>${focusContent[view][1]}</p><div class="approval-note">${focusContent[view][2]}</div><button class="next-review" data-view="all">${icon('grid')} Back to all screens</button></aside>`)+selected.map((s,i)=>`<article class="screen-card" data-card="${s}"><div class="screen-label"><i>${String(screens.indexOf(s)+1).padStart(2,'0')}</i>${labels[s].toUpperCase()}</div><div class="screen-stage"><div class="device">${screenRenderers[s]()}</div></div><p class="screen-note">${notes[s]}</p>${view==='game'?'<div class="flow-tools"><button data-action="time-state">Timer warning state</button><button data-action="results">Preview completion →</button></div>':''}</article>`).join('');scalePhones();bindBoard();}
function scalePhones(){document.querySelectorAll('.screen-stage').forEach(stage=>{stage.querySelector('.device').style.transform=`scale(${stage.getBoundingClientRect().width/390})`})}new ResizeObserver(scalePhones).observe($('#gallery'));
function go(screen){render(screen);window.scrollTo({top:0,behavior:'smooth'})}
function getActiveScreen(el){return el?.closest('.screen')||$(`[data-screen="${currentView}"]`)||$('.screen')}
function toast(message,root){root=root||getActiveScreen();root.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=message;root.append(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),2600)}
function modal(root,title,message,ico='help',primary='Back to the fun',action='dismiss',secondary=''){root.querySelector('.modal-shade')?.remove();const shade=document.createElement('div');shade.className='modal-shade';shade.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="modal-icon">${icon(ico)}</div><h3>${title}</h3><p>${message}</p>${button(primary,action,'purple','')}${secondary?`<button class="text-close" data-action="dismiss">${secondary}</button>`:''}</section>`;root.append(shade);shade.querySelector('button').focus()}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const root=getActiveScreen(el);if(el.dataset.view){if(el.dataset.view==='game'){gameFound=['CAT','DOG','TIGER'];gameScore=30;hints=3}go(el.dataset.view);return}if(el.dataset.category!==undefined){const i=Number(el.dataset.category);if(i===0||(unlockedPreview&&i===1)){categoryIndex=i;go('mode')}else modal(root,'A world to unlock',`Complete ${categories[i-1][0]} to open ${categories[i][0]}. One little victory at a time.`,'lock','Got it');return}if(el.dataset.mode){mode=el.dataset.mode;if(currentView==='all'){root.outerHTML=modeScreen()}else render('mode');return}const action=el.dataset.action;if(!action)return;if(screens.includes(action)){if(action==='game'){gameFound=['CAT','DOG','TIGER'];gameScore=30;hints=3;if(categoryIndex!==0)categoryIndex=0}go(action);return}switch(action){case 'sound':soundEnabled=!soundEnabled;el.innerHTML=icon(soundEnabled?'sound':'muted');toast(soundEnabled?'Sound on · visual preview':'Sound off',root);break;case 'howto':modal(root,'Hello, word hunter!','Drag across letters in a straight line. Search forwards, backwards, or diagonally. Find every word to unlock a new world.','swipe','Let’s go','categories');break;case 'pause':modal(root,'Take a tiny break.','Your words aren’t going anywhere. Ready for another little aha?','clock','Keep hunting','dismiss','');const exit=document.createElement('button');exit.className='text-close';exit.dataset.action='categories';exit.textContent='Leave puzzle';root.querySelector('.modal').append(exit);break;case 'dismiss':root.querySelector('.modal-shade')?.remove();break;case 'hint':showHint(root);break;case 'reward':modal(root,'A little extra help?','In the finished app, watch a rewarded ad for one extra hint. This is a design preview: no ad will play.','bulb','Preview extra hint','grant-hint','Not now');break;case 'grant-hint':hints++;root.querySelector('.modal-shade')?.remove();updateHint(root);toast('+1 hint · preview only',root);break;case 'next-level':unlockedPreview=true;categoryIndex=1;go('mode');break;case 'replay':gameFound=[];gameScore=0;hints=3;categoryIndex=0;go('game');break;case 'time-state':{const timer=$('.timer-pill');timer.classList.toggle('danger');timer.querySelector('span').textContent=timer.classList.contains('danger')?'0:24':mode==='classic'?'0:42':'1:18';break}}});
function updateHint(root){const btn=root.querySelector('.hint-button');if(btn){btn.disabled=hints<=0;btn.querySelector('.hint-badge').textContent=hints}}
function showHint(root){if(!hints)return;const word=animals.find(w=>!gameFound.includes(w)&&placements[w]);if(!word)return;hints--;updateHint(root);root.querySelectorAll('.hint').forEach(c=>c.classList.remove('hint'));for(const [r,c]of placements[word]){const cell=root.querySelector(`[data-row="${r}"][data-col="${c}"]`);cell.classList.remove('hint');void cell.offsetWidth;cell.classList.add('hint')}setTimeout(()=>root.querySelectorAll('.hint').forEach(c=>c.classList.remove('hint')),1500)}
function bindBoard(){document.querySelectorAll('.letter-board').forEach(board=>{let activePointer=null;function cellAt(e){const rect=board.getBoundingClientRect(),col=Math.floor((e.clientX-rect.left)/rect.width*12),row=Math.floor((e.clientY-rect.top)/rect.height*12);return row>=0&&row<12&&col>=0&&col<12?[row,col]:null}function selectTo(end){if(!dragStart||!end)return;const dy=end[0]-dragStart[0],dx=end[1]-dragStart[1];if(dx&&dy&&Math.abs(dx)!==Math.abs(dy))return;selection=Array.from({length:Math.max(Math.abs(dx),Math.abs(dy))+1},(_,i)=>[dragStart[0]+Math.sign(dy)*i,dragStart[1]+Math.sign(dx)*i]);board.querySelectorAll('.selected').forEach(c=>c.classList.remove('selected'));selection.forEach(([r,c])=>board.querySelector(`[data-row="${r}"][data-col="${c}"]`).classList.add('selected'));board.closest('.screen').querySelector('.selection-caption span').textContent=selection.map(([r,c])=>grid[r][c]).join(' · ')}board.addEventListener('pointerdown',e=>{if(e.button!==0)return;activePointer=e.pointerId;dragStart=cellAt(e);selection=[];board.setPointerCapture(e.pointerId);selectTo(dragStart);e.preventDefault()});board.addEventListener('pointermove',e=>{if(activePointer===e.pointerId)selectTo(cellAt(e))});board.addEventListener('pointerup',e=>{if(activePointer!==e.pointerId)return;const root=board.closest('.screen'),text=selection.map(([r,c])=>grid[r][c]).join(''),reversed=[...text].reverse().join(''),word=animals.find(w=>w===text||w===reversed);if(word&&!gameFound.includes(word)){gameFound.push(word);gameScore+=10;root.querySelector('#sample-score').textContent=gameScore;root.querySelector(`[data-word="${word}"]`).classList.add('found');root.querySelector('.board-lines').innerHTML=lines();root.querySelector('#found-count').textContent=`${gameFound.length} / 18 found`;root.querySelector('#found-progress').style.width=`${gameFound.length/18*100}%`;toast(`${word} · A little aha! +10`,root)}else if(selection.length>1)toast(word?'You found that one already!':'Not quite. Try another little trail.',root);board.querySelectorAll('.selected').forEach(c=>c.classList.remove('selected'));root.querySelector('.selection-caption span').textContent='Swipe a word. Any direction.';activePointer=null;dragStart=null;selection=[]});board.addEventListener('pointercancel',()=>{activePointer=null;dragStart=null;selection=[];board.querySelectorAll('.selected').forEach(c=>c.classList.remove('selected'));board.closest('.screen').querySelector('.selection-caption span').textContent='Swipe a word. Any direction.'})})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const shade=$('.modal-shade');if(shade)shade.remove();else if(currentView!=='all')go('all')}});
render('all');
})();
</script>
</body>
</html>
